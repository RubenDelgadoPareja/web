  </text>

  <rect x="130" y="430" width="340" height="14" rx="7" fill="url(#accent)" />

  <text x="130" y="495" fill="#475569" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22">
    ruben-delgado.dev
