  </text>
  <text x="130" y="255" fill="#0f766e" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" font-weight="600">
    Frontend Engineer
  </text>
  <text x="130" y="320" fill="#334155" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="28">
